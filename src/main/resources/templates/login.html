<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — SecureApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-page">

<div class="auth-split">
    <div class="auth-brand">
        <div class="brand-inner">
            <div class="brand-logo">
                <span class="shield-icon">🔐</span>
            </div>
            <h1 class="brand-title">SecureApp</h1>
            <p class="brand-tagline">Two-factor authentication<br/>done right.</p>
            <div class="brand-features">
                <div class="feature-item"><span class="dot"></span> TOTP Standard (RFC 6238)</div>
                <div class="feature-item"><span class="dot"></span> AES-256-GCM Encryption</div>
                <div class="feature-item"><span class="dot"></span> Works with any authenticator app</div>
            </div>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-card">
            <div class="card-header">
                <h2>Welcome back</h2>
                <p>Sign in to your account</p>
            </div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>
            <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username"
                           placeholder="your_username" required autocomplete="username"/>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password"
                           placeholder="••••••••" required autocomplete="current-password"/>
                </div>

                <button type="submit" class="btn btn-primary">Sign In →</button>
            </form>

            <p class="auth-switch">No account? <a th:href="@{/register}">Create one</a></p>
        </div>
    </div>
</div>

</body>
</html>
