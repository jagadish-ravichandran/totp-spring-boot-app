<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Verify 2FA — SecureApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-page">

<div class="auth-split">
    <div class="auth-brand">
        <div class="brand-inner">
            <div class="brand-logo"><span class="shield-icon">🔑</span></div>
            <h1 class="brand-title">One more step</h1>
            <p class="brand-tagline">Enter your<br/>authenticator code.</p>
            <div class="brand-features">
                <div class="feature-item"><span class="dot"></span> Open your authenticator app</div>
                <div class="feature-item"><span class="dot"></span> Find the SecureApp entry</div>
                <div class="feature-item"><span class="dot"></span> Enter the 6-digit code</div>
            </div>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-card">
            <div class="card-header">
                <h2>Two-Factor Auth</h2>
                <p>Logged in as <strong th:text="${username}">user</strong></p>
            </div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/verify-2fa}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label>Authentication Code</label>
                    <input type="text" name="code" id="otpCode"
                           placeholder="000000"
                           maxlength="6" pattern="[0-9]{6}"
                           class="otp-input-lg" autocomplete="one-time-code"
                           inputmode="numeric" required/>
                    <small class="field-hint">Code refreshes every 30 seconds</small>
                </div>

                <button type="submit" class="btn btn-primary">Verify →</button>
            </form>

            <div class="otp-timer">
                <div class="timer-bar">
                    <div class="timer-fill" id="timerFill"></div>
                </div>
                <span id="timerText">30s</span>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('otpCode').focus();

    document.getElementById('otpCode').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 6);
    });

    // 30-second countdown timer
    function updateTimer() {
        const now = Math.floor(Date.now() / 1000);
        const remaining = 30 - (now % 30);
        const pct = (remaining / 30) * 100;
        document.getElementById('timerFill').style.width = pct + '%';
        document.getElementById('timerText').textContent = remaining + 's';
    }
    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
