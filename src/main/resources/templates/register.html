<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register — SecureApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-page">

<div class="auth-split">
    <div class="auth-brand">
        <div class="brand-inner">
            <div class="brand-logo"><span class="shield-icon">🔐</span></div>
            <h1 class="brand-title">SecureApp</h1>
            <p class="brand-tagline">Security starts<br/>at sign-up.</p>
            <div class="brand-features">
                <div class="feature-item"><span class="dot"></span> Secure by default</div>
                <div class="feature-item"><span class="dot"></span> Enable 2FA after registration</div>
                <div class="feature-item"><span class="dot"></span> Passwords hashed with BCrypt</div>
            </div>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-card">
            <div class="card-header">
                <h2>Create account</h2>
                <p>Get started in seconds</p>
            </div>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" th:field="*{username}"
                           placeholder="cool_username" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('username')}"
                          th:errors="*{username}"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}"
                           placeholder="you@email.com" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" th:field="*{password}"
                           placeholder="Min 6 characters" required/>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}"></span>
                </div>

                <button type="submit" class="btn btn-primary">Create Account →</button>
            </form>

            <p class="auth-switch">Already have an account? <a th:href="@{/login}">Sign in</a></p>
        </div>
    </div>
</div>

</body>
</html>
